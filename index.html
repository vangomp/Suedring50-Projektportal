<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Südring 50 · Projektapp</title>
<meta name="description" content="Projektapp Südring 50, Seligenstadt – Fortschritt, Dokumente, Finanzen und Termine." />

<!-- PWA / Homescreen -->
<meta name="theme-color" content="#0f2742" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Südring 50" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230f2742'/%3E%3Ctext x='90' y='120' font-size='80' font-family='Arial,sans-serif' font-weight='700' fill='%23e0a83e' text-anchor='middle'%3ES50%3C/text%3E%3C/svg%3E" />

<style>
:root{
  --navy:#0f2742; --navy-2:#173a5e; --gold:#e0a83e; --gold-2:#c9912b;
  --bg:#f4f6f9; --card:#ffffff; --line:#e4e9f0; --txt:#1c2733; --muted:#697787;
  --green:#1f9d6b; --green-bg:#e6f6ef; --amber:#e0972a; --amber-bg:#fdf2dd;
  --red:#d6493b; --red-bg:#fbe7e4; --blue:#2d6fb8; --blue-bg:#e6f0fa;
  --shadow:0 1px 3px rgba(16,38,66,.06),0 6px 20px rgba(16,38,66,.06);
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--txt);line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,.93)), url('login-bg.jpg') center/cover no-repeat}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;font-size:16px}
.hidden{display:none!important}
img{max-width:100%}
a{color:var(--blue)}

/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:url('login-bg.jpg') center/cover no-repeat, #20242b}
.login-card{width:100%;max-width:380px;background:var(--card);border-radius:22px;padding:30px 26px 26px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:4px}
.logo{width:46px;height:46px;border-radius:12px;background:#181818;color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:17px;letter-spacing:.5px;flex-shrink:0;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand small{color:var(--muted);font-size:12px;letter-spacing:.5px;text-transform:uppercase}
.brand b{font-size:16px}
.login-card h1{font-size:21px;margin:18px 0 2px}
.login-card .sub{color:var(--muted);font-size:14px;margin-bottom:20px}
.role-tabs{display:flex;gap:8px;margin-bottom:16px}
.role-tabs button{flex:1;padding:10px 4px;border:1.5px solid var(--line);border-radius:12px;font-weight:600;font-size:12px;color:var(--muted);background:#fafbfc;transition:.15s;line-height:1.15}
.role-tabs button.active{border-color:var(--navy);color:var(--navy);background:#fff;box-shadow:var(--shadow)}
.role-tabs button .em{display:block;font-size:18px;margin-bottom:2px}
label.fld{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
.input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fafbfc;margin-bottom:14px}
.input:focus{outline:none;border-color:var(--navy);background:#fff}
.btn-primary{width:100%;padding:14px;background:var(--navy);color:#fff;border-radius:12px;font-weight:700;font-size:15px;transition:.15s}
.btn-primary:hover{background:var(--navy-2)}
.login-err{color:var(--red);font-size:13.5px;margin:-4px 0 12px;min-height:18px}
.hint{margin-top:18px;padding:12px 14px;background:#f3f6fa;border-radius:12px;font-size:12.5px;color:var(--muted);line-height:1.55}
.hint b{color:var(--txt)}

/* SHELL */
#app{max-width:1280px;margin:0 auto;min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:12px}
.topbar .logo{width:38px;height:38px;font-size:14px}
.topbar .t-meta{flex:1;min-width:0}
.topbar .t-meta b{display:block;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .t-meta span{font-size:12px;color:#a9c0db}
.rolepill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap}
.icon-btn{color:#cdddef;font-size:13px;font-weight:600;padding:6px 8px;border-radius:8px}
.icon-btn:hover{background:rgba(255,255,255,.1)}
main{padding:16px 16px 94px}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2.vt{font-size:20px;margin:4px 0 2px}
.vsub{color:var(--muted);font-size:13.5px;margin:0 0 16px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .c-act{margin-left:auto;font-size:12.5px;color:var(--blue);font-weight:600;cursor:pointer}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap}
.b-green{background:var(--green-bg);color:var(--green)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-blue{background:var(--blue-bg);color:var(--blue)}
.b-gray{background:#eef1f5;color:var(--muted)}

.hero{background:linear-gradient(150deg,var(--navy),#21507f);color:#fff;border:none}
.hero h3{color:#fff}
.hero .big{font-size:40px;font-weight:800;line-height:1}
.hero .big small{font-size:16px;font-weight:600;color:#bcd2ea}
.pbar{height:10px;border-radius:8px;background:rgba(255,255,255,.18);overflow:hidden;margin:14px 0 6px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#f0c46a);border-radius:8px;transition:width .6s}
.hero .meta{display:flex;justify-content:space-between;font-size:12.5px;color:#bcd2ea;margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.kpi{background:rgba(255,255,255,.1);border-radius:12px;padding:11px 10px;text-align:center}
.kpi b{display:block;font-size:18px}
.kpi span{font-size:11px;color:#bcd2ea}

.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 18px}
.tl-item:last-child{padding-bottom:2px}
.tl-dot{position:absolute;left:-26px;top:2px;width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.dot-done{background:var(--green)} .dot-prog{background:var(--gold)} .dot-up{background:#cfd8e2} .dot-late{background:var(--red)}
.tl-item h4{margin:0;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl-dates{font-size:12.5px;color:var(--muted);margin-top:3px}
.tl-dates .delta{color:var(--red);font-weight:600}
.tl-dates .ok{color:var(--green);font-weight:600}

.row{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .r-main{flex:1;min-width:0}
.row .r-main b{font-size:14.5px}
.row .r-main p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.row .r-right{text-align:right;flex-shrink:0}
.amount{font-weight:700;font-size:14.5px;white-space:nowrap}

.fin-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.fin-box{background:#f7f9fc;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.fin-box b{display:block;font-size:18px} .fin-box span{font-size:11.5px;color:var(--muted)}

.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal .ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#e8edf3;cursor:pointer}
.gal .ph img{width:100%;height:100%;object-fit:cover;display:block}
.gal .ph .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;font-size:10px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uploadtile{aspect-ratio:1;border:2px dashed #c4d0dd;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:12px;gap:4px;background:#fafcff;cursor:pointer}
.uploadtile:hover{border-color:var(--navy);color:var(--navy)}
.uploadtile .pl{font-size:24px;line-height:1}

.cmt{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}
.cmt:last-child{border-bottom:none}
.av{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
.cmt .c-body{flex:1;min-width:0}
.cmt .c-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cmt .c-head b{font-size:14px}
.cmt .c-head .role{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:20px;background:#eef1f5;color:var(--muted)}
.cmt .c-head time{font-size:11.5px;color:var(--muted)}
.cmt p{margin:4px 0 0;font-size:14px}
.composer{display:flex;gap:8px;margin-top:14px}
.composer textarea{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:11px;resize:none;background:#fafbfc;min-height:44px}
.composer textarea:focus{outline:none;border-color:var(--navy);background:#fff}
.send{background:var(--navy);color:#fff;border-radius:12px;padding:0 18px;font-weight:700;flex-shrink:0}

.mp-frame{border-radius:14px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/10;background:#0c1722;display:flex;align-items:center;justify-content:center;text-align:center;color:#9fb4cb}
.mp-frame iframe{width:100%;height:100%;border:0;display:block}
.mp-cta{display:inline-flex;align-items:center;gap:8px;margin-top:12px;background:var(--gold);color:#3a2c08;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;text-decoration:none}

.btn-sm{font-size:12.5px;font-weight:700;padding:8px 13px;border-radius:10px;background:var(--navy);color:#fff}
.btn-ghost{background:#eef2f7;color:var(--navy)}

/* contacts */
.contact{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.contact:last-child{border-bottom:none}
.contact .c-info{flex:1;min-width:0}
.contact .c-info b{font-size:14.5px}
.contact .c-info p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.callbtns{display:flex;gap:8px;flex-shrink:0}
.callbtns a{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;text-decoration:none}
.callbtns .call{background:var(--green-bg);color:var(--green)}
.callbtns .mail{background:var(--blue-bg);color:var(--blue)}
.callbtns .edit{background:#eef1f5;color:var(--muted);cursor:pointer;font-size:15px}
.callbtns .del{background:var(--red-bg);color:var(--red);cursor:pointer;font-size:15px}
.g-msrow .g-track{height:16px}

/* meetings */
.mtg{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}
.mtg:last-child{border-bottom:none}
.mtg .date-chip{width:54px;flex-shrink:0;text-align:center;background:#f3f6fa;border:1px solid var(--line);border-radius:12px;padding:7px 2px}
.mtg .date-chip .d{font-size:20px;font-weight:800;line-height:1}
.mtg .date-chip .m{font-size:11px;color:var(--muted);text-transform:uppercase}
.mtg .m-info b{font-size:14.5px}
.mtg .m-info p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}

/* documents */
.doc{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:none}
.doc .d-ic{width:40px;height:40px;border-radius:10px;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.doc .d-info{flex:1;min-width:0}
.doc .d-info b{font-size:14px}
.doc .d-info p{margin:2px 0 0;font-size:12px;color:var(--muted)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:flex-start;gap:4px;padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);max-width:1280px;margin:0 auto;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:1 0 78px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11.5px;font-weight:700;padding:9px 2px;border-radius:14px;transition:.15s}
.nav button .ic{font-size:23px;line-height:1}
.nav button:hover{background:#f3f6fa}
.nav button.active{color:#fff;background:var(--navy)}
.nav button.active .ic{filter:none}

.modal{position:fixed;inset:0;z-index:80;background:rgba(8,18,32,.88);display:flex;align-items:center;justify-content:center;padding:20px}
.modal img{max-width:100%;max-height:80vh;border-radius:12px}
.modal .x{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:18px;color:#fff;font-size:30px;width:40px;height:40px}
.modal .mcap{position:absolute;bottom:30px;left:0;right:0;text-align:center;color:#cdddef;font-size:13px;padding:0 20px}

/* install sheet */
.sheet-bg{position:fixed;inset:0;z-index:90;background:rgba(8,18,32,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:#fff;border-radius:22px 22px 0 0;padding:22px 22px calc(env(safe-area-inset-bottom) + 22px);box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:up .3s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .s-ico{width:58px;height:58px;border-radius:15px;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;margin:0 auto 12px}
.sheet h3{text-align:center;margin:0 0 6px;font-size:18px}
.sheet p{text-align:center;color:var(--muted);font-size:14px;margin:0 0 16px}
.steps{background:#f5f8fc;border-radius:14px;padding:14px 16px;margin-bottom:16px}
.steps .st{display:flex;gap:11px;align-items:flex-start;padding:7px 0;font-size:14px}
.steps .st b{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.steps .st . share-ic{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:#007aff;color:#fff;border-radius:6px;font-size:13px;vertical-align:middle}
.sheet .btn-primary{margin-bottom:8px}
.sheet .dismiss{width:100%;text-align:center;color:var(--muted);font-size:14px;font-weight:600;padding:10px}

/* install banner */
.installbar{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,var(--gold),#f0c46a);color:#3a2c08;padding:12px 14px;border-radius:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.installbar .ib-txt{flex:1;font-size:13.5px;font-weight:600;line-height:1.35}
.installbar button{background:var(--navy);color:#fff;font-weight:700;font-size:13px;padding:9px 14px;border-radius:10px;flex-shrink:0}
.installbar .ib-close{background:transparent;color:#6b541a;font-size:18px;padding:4px 6px}

/* welcome / marketing */
.welcome{position:relative;border:none;color:#fff;overflow:hidden;padding:0;background:linear-gradient(135deg,#0f2742,#21507f 58%,#2d6fb8)}
.welcome .w-inner{position:relative;z-index:2;padding:24px 20px 22px}
.welcome::after{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(circle at 82% 18%,rgba(224,168,62,.28),transparent 55%)}
.welcome .eyebrow{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);font-weight:800}
.welcome h2{margin:8px 0 3px;font-size:30px;font-weight:800;letter-spacing:-.6px}
.welcome .addr{color:#cfe0f2;font-size:13.5px}
.welcome .w-greet{margin-top:14px;font-size:14.5px;color:#eaf2fb;line-height:1.5}
.welcome .w-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.welcome .w-tags span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:20px}
.strip-title{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:0 0 11px;display:flex;align-items:center;gap:7px}
.strip-title .c-act{margin-left:auto;color:var(--blue);font-size:12px;cursor:pointer;text-transform:none;letter-spacing:0}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{display:none}
.pcard{flex:0 0 150px;scroll-snap-align:start;border-radius:14px;overflow:hidden;background:#e8edf3;position:relative;height:115px;cursor:pointer;box-shadow:var(--shadow)}
.pcard img{width:100%;height:100%;object-fit:cover}
.pcard .emoji{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:40px}
.pcard .pc-cap{position:absolute;left:0;right:0;bottom:0;padding:18px 9px 7px;font-size:10.5px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.72));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* two-column layouts */
.two-col{display:flex;gap:14px;align-items:flex-start}
.two-col .col-main,.two-col .col60{flex:3;min-width:0}
.two-col .col-side,.two-col .col40{flex:2;min-width:0}
@media(max-width:680px){.two-col{flex-direction:column}.two-col>*{width:100%}}

/* gantt */
.g-scroll{max-height:66vh;overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:4px}
.g-scroll::-webkit-scrollbar{height:10px;width:10px}.g-scroll::-webkit-scrollbar-thumb{background:#c4d0dd;border-radius:6px}
.gantt{font-size:12px;min-width:480px}
.g-row{display:flex;align-items:center;min-height:26px}
.g-head{height:24px;position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.g-lbl{flex:0 0 150px;width:150px;padding:0 8px 0 10px;font-size:11px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:sticky;left:0;background:#fff;z-index:3}
.g-head .g-lbl{z-index:6}
.g-track{position:relative;flex:1;height:20px;border-left:1px solid var(--line)}
.g-axis{height:18px}
.g-bar{position:absolute;top:4px;height:12px;border-radius:6px;min-width:3px}
.g-tick{position:absolute;top:0;bottom:0;border-left:1px dashed #e9eef4}
.g-tick.g-tick-m{border-left:1px solid #cfd8e2}
.g-tick span{position:absolute;top:0;left:2px;font-size:9.5px;color:var(--muted);white-space:nowrap}
/* gantt zoom toolbar */
.g-zoom{display:flex;align-items:center;gap:6px;margin:2px 0 6px;flex-wrap:wrap}
.g-zoom .gz-lbl{font-size:11px;color:var(--muted);margin-right:2px;font-weight:600}
.gz-btn{font-size:11.5px;font-weight:600;padding:5px 11px;border:1px solid var(--line);border-radius:8px;background:#fafbfc;color:var(--muted)}
.gz-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.gz-save{margin-left:auto;font-size:11.5px;font-weight:600;padding:5px 11px;border:1px solid var(--navy);border-radius:8px;background:#fff;color:var(--navy)}
.gz-save:active{background:var(--navy);color:#fff}

function dataURLtoBlob(dataUrl){
  const parts=dataUrl.split(','); const mime=(parts[0].match(/:(.*?);/)||[])[1]||'image/jpeg';
  const bin=atob(parts[1]); const len=bin.length; const arr=new Uint8Array(len);
  for(let i=0;i<len;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}

function ftime(iso){const d=new Date(iso);return isNaN(d)?iso:d.toLocaleDateString("de-DE",{day:"2-digit",month:"short"})+" · "+d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});}
function fmeeting(iso){const d=new Date(iso);return d.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"long"})+" · "+d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})+" Uhr";}
function esc(s){return(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5);}

  genehmigt:{cls:"b-green",txt:"Genehmigt"},bezahlt:{cls:"b-green",txt:"Bezahlt"},
  pruefung:{cls:"b-blue",txt:"In Prüfung"},eingereicht:{cls:"b-amber",txt:"Eingereicht"},
  offen:{cls:"b-amber",txt:"Offen"},geplant:{cls:"b-gray",txt:"Geplant"},abgelehnt:{cls:"b-red",txt:"Abgelehnt"}
};
function badge(k){const m=STATUS_MAP[k]||{cls:"b-gray",txt:k};return `<span class="badge ${m.cls}">${m.txt}</span>`;}

function doLogin(){
  const u=$("#user").value.trim().toLowerCase(); const pw=$("#pw").value;

}
function startSession(username){const U=USERS[username]; if(!U) return; ROLE=U.role; USERNAME=U.name;
  try{sessionStorage.setItem(SESSION_KEY,username);}catch(e){}
  $("#login").classList.add("hidden");$("#app").classList.remove("hidden");

  render(); maybeOfferInstall();}

}
let KEEP_SCROLL=false;
/* Re-render ohne dass der Bildschirm nach oben springt (z.B. Tabellen-Edits) */
function rerenderKeepScroll(){const y=window.scrollY;KEEP_SCROLL=true;render();KEEP_SCROLL=false;window.scrollTo(0,y);}
/* ---- Gantt-Zoom & gespeicherte Ansicht ---- */
function savedGView(){try{return JSON.parse(localStorage.getItem('sr50_gview')||'null');}catch(e){return null;}}
let GZOOM=(savedGView()&&savedGView().zoom)||'M';
function setGZoom(z){GZOOM=z; render();}
function saveGView(){const sc=document.getElementById('gScroll');const v={zoom:GZOOM,sl:sc?sc.scrollLeft:0,st:sc?sc.scrollTop:0};try{localStorage.setItem('sr50_gview',JSON.stringify(v));toast('Ansicht gespeichert ✓');}catch(e){toast('Speichern nicht möglich');}}
function restoreGScroll(){const sc=document.getElementById('gScroll');if(!sc)return;const v=savedGView();if(v&&v.zoom===GZOOM){sc.scrollLeft=v.sl||0;sc.scrollTop=v.st||0;}}
function toast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}t.textContent=msg;t.className='show';clearTimeout(t._tm);t._tm=setTimeout(()=>{t.className='';},1800);}

function nextMeeting(){const now=Date.now();return DATA.meetings.filter(x=>(x.type==='vorort'||x.type==='online')&&x.date&&new Date(x.date)>=now-36e5).sort((a,b)=>new Date(a.date)-new Date(b.date))[0];}

function tblEntries(){
  const rows=[];
  DATA.phases.forEach((p,i)=>rows.push({src:'p',i,name:p.name,typ:'aktivitaet',start:p.planStart,end:p.planEnd,status:p.status}));
  DATA.meetings.forEach((m,i)=>rows.push({src:'m',i,name:m.title,typ:m.type,start:(m.date||'').slice(0,10),end:m.end||(m.date||'').slice(0,10),status:m.status||'up'}));
  rows.sort((a,b)=>new Date(a.start)-new Date(b.start));
  return rows;
}
function tblDur(s,e,typ){ if(typ==='meilenstein'||typ==='vorort'||typ==='online') return '–'; if(!s) return '–'; const a=new Date(s),b=new Date(e||s); if(isNaN(a)||isNaN(b)) return '–'; const d=Math.round((b-a)/864e5)+1; return d+(d===1?' Tag':' Tage'); }
function tableHTML(){
  const rows=tblEntries();
  const typOpts=[['aktivitaet','Aktivität'],['meilenstein','Meilenstein'],['vorort','Vor-Ort'],['online','Zoom']];
  const statOpts=[['up','Geplant'],['prog','In Arbeit'],['done','Fertig'],['late','Verzug']];
  const sel=(val,opts,h)=>`<select class="tbl-in" onchange="${h}">${opts.map(o=>`<option value="${o[0]}"${o[0]===val?' selected':''}>${o[1]}</option>`).join('')}</select>`;
  return `<div class="tbl-wrap"><table class="tbl">
    <thead><tr><th>Aktion</th><th>Typ</th><th>Anfang</th><th>Ende</th><th>Dauer</th><th>Status</th><th></th></tr></thead><tbody>
    ${rows.length?rows.map(r=>`<tr>
      <td><input class="tbl-in tbl-name" value="${esc(r.name)}" onchange="tblSet('${r.src}',${r.i},'name',this.value)"></td>
      <td>${sel(r.typ,typOpts,`tblSet('${r.src}',${r.i},'typ',this.value)`)}</td>
      <td><input class="tbl-in" type="date" value="${r.start||''}" onchange="tblSet('${r.src}',${r.i},'start',this.value)"></td>
      <td>${r.typ==='aktivitaet'?`<input class="tbl-in" type="date" value="${r.end||''}" onchange="tblSet('${r.src}',${r.i},'end',this.value)">`:'<span class="tbl-muted">–</span>'}</td>
      <td class="tbl-dur">${tblDur(r.start,r.end,r.typ)}</td>
      <td>${r.typ==='meilenstein'?'<span class="tbl-muted">–</span>':sel(r.status||'up',statOpts,`tblSet('${r.src}',${r.i},'status',this.value)`)}</td>
      <td><a onclick="tblDel('${r.src}',${r.i})" class="tbl-del" title="Löschen">🗑️</a></td>
    </tr>`).join(''):'<tr><td colspan="7"><div class="empty">Noch keine Einträge.</div></td></tr>'}
    </tbody></table></div>`;
}
function tblSet(src,i,field,val){
  if(src==='p'){
    const p=DATA.phases[i]; if(!p) return;
    if(field==='name')p.name=val;
    else if(field==='start')p.planStart=val;
    else if(field==='end')p.planEnd=val;
    else if(field==='status')p.status=val;
    else if(field==='typ'&&val!=='aktivitaet'){
      const nm={title:p.name,type:val,date:p.planStart,status:p.status};
      DATA.meetings.push(nm); DATA.phases.splice(i,1);
    }
  } else {
    const m=DATA.meetings[i]; if(!m) return;
    if(field==='name')m.title=val;
    else if(field==='start'){const t=(m.date||'').slice(11);m.date=val+(t?('T'+t):'');}
    else if(field==='end')m.end=val;
    else if(field==='status')m.status=val;
    else if(field==='typ'){m.type=val; if(val==='meilenstein')delete m.end; if(val==='aktivitaet'&&!m.end)m.end=(m.date||'').slice(0,10);}
  }
  save(); rerenderKeepScroll();
}
function tblDel(src,i){ if(!confirm("Zeile löschen?")) return; if(src==='p')DATA.phases.splice(i,1); else DATA.meetings.splice(i,1); save(); rerenderKeepScroll(); }
function tblAdd(){ DATA.meetings.push({title:"Neuer Eintrag",type:"aktivitaet",date:TODAY(),end:TODAY(),status:"up"}); save(); rerenderKeepScroll(); }

const TTYPE={aktivitaet:{label:"Aktivität",ic:"📊"},meilenstein:{label:"Meilenstein",ic:"◆"},vorort:{label:"Vor-Ort",ic:"📍"},online:{label:"Online / Zoom",ic:"💻"}};
function termRow(mt){
  const d=new Date(mt.date); const past=d<Date.now()-864e5;
  const ty=TTYPE[mt.type]||TTYPE.vorort; const idx=DATA.meetings.indexOf(mt);
  const datestr = mt.type==='aktivitaet' ? (fdateShort(mt.date)+'–'+fdateShort(mt.end||mt.date))
    : (mt.type==='meilenstein' ? fdate(mt.date) : fmeeting(mt.date));
  return `<div class="mtg" style="${past?'opacity:.55':''}">
    <div class="date-chip"><div class="d">${d.getDate()}</div><div class="m">${d.toLocaleDateString("de-DE",{month:"short"})}</div></div>
    <div class="m-info"><b>${esc(mt.title)}</b> <span class="badge b-gray" style="font-size:10px">${ty.ic} ${ty.label}</span>
      <p>🕒 ${datestr}</p>
      ${mt.place?`<p>📍 ${esc(mt.place)}</p>`:''}
      ${mt.who?`<p>👥 ${esc(mt.who)}</p>`:''}
      ${isBoard()?`<p><a onclick="editMeeting(${idx})" style="color:var(--blue);font-weight:600">bearbeiten</a> · <a onclick="delMeeting(${idx})" style="color:var(--red);font-weight:600">löschen</a></p>`:''}
    </div></div>`;
}
function ganttHTML(){
  const items=DATA.phases.map((p,i)=>({kind:'act',name:p.name,start:p.planStart,end:p.planEnd,status:p.status,sort:p.planStart,src:'p',si:i}))
    .concat(DATA.meetings.filter(m=>m.type==='aktivitaet'&&m.date).map(m=>({kind:'act',name:m.title,start:m.date,end:m.end||m.date,status:m.status||'akt',sort:m.date,src:'m',si:DATA.meetings.indexOf(m)})))
    .concat(DATA.meetings.filter(m=>m.type==='meilenstein'&&m.date).map(m=>({kind:'ms',name:m.title,date:(m.date||'').slice(0,10),sort:m.date,src:'m',si:DATA.meetings.indexOf(m)})));
  let ds=[]; items.forEach(it=>{ if(it.kind==='act'){ds.push(it.start,it.end);} else ds.push(it.date); });
  ds=ds.filter(Boolean).map(d=>new Date(d)).filter(d=>!isNaN(d));
  if(!ds.length) return '<div class="empty">Keine Phasen.</div>';
  let min=new Date(Math.min.apply(null,ds.map(d=>+d))), max=new Date(Math.max.apply(null,ds.map(d=>+d)));
  min.setDate(min.getDate()-5); max.setDate(max.getDate()+5);
  const total=(max-min)||1; const pos=d=>((new Date(d)-min)/total*100);
  items.sort((a,b)=>new Date(a.sort)-new Date(b.sort));
  const totalDays=total/864e5;
  const GZ={M:{ppd:3.4,label:'Monat'},W:{ppd:11,label:'Woche'},T:{ppd:30,label:'Tag'}};
  const ppd=(GZ[GZOOM]||GZ.M).ppd;
  const trackPx=Math.max(480,Math.round(totalDays*ppd));
  const contW=150+trackPx;
  let ticks='';
  if(GZOOM==='M'){
    let c=new Date(min.getFullYear(),min.getMonth(),1);
    while(c<=max){const l=pos(c); if(l>=0&&l<=100) ticks+=`<div class="g-tick g-tick-m" style="left:${l}%"><span>${c.toLocaleDateString('de-DE',{month:'short'})}</span></div>`; c.setMonth(c.getMonth()+1);}
  } else if(GZOOM==='W'){
    let c=new Date(min); c.setHours(0,0,0,0); c.setDate(c.getDate()-((c.getDay()+6)%7));
    while(c<=max){const l=pos(c); if(l>=0&&l<=100){const mm=c.getDate()<=7?' g-tick-m':''; ticks+=`<div class="g-tick${mm}" style="left:${l}%"><span>${c.toLocaleDateString('de-DE',{day:'numeric',month:'numeric'})}</span></div>`;} c.setDate(c.getDate()+7);}
  } else {
    let c=new Date(min); c.setHours(0,0,0,0);
    while(c<=max){const l=pos(c); if(l>=0&&l<=100){const f=c.getDate()===1; ticks+=`<div class="g-tick${f?' g-tick-m':''}" style="left:${l}%"><span>${f?c.toLocaleDateString('de-DE',{day:'numeric',month:'short'}):c.getDate()}</span></div>`;} c.setDate(c.getDate()+1);}
  }
  const zbtns=Object.keys(GZ).map(z=>`<button class="gz-btn${GZOOM===z?' active':''}" onclick="setGZoom('${z}')">${GZ[z].label}</button>`).join('');
  const toolbar=`<div class="g-zoom"><span class="gz-lbl">🔍 Zoom</span>${zbtns}<button class="gz-save" onclick="saveGView()">💾 Ansicht speichern</button></div>`;
  const tl=pos(new Date()); const today=(tl>=0&&tl<=100)?`<div class="g-today" style="left:${tl}%"></div>`:'';
  const col={done:'#1f9d6b',prog:'#e0a83e',up:'#cfd8e2',late:'#d6493b',akt:'#2d6fb8'};
  const clk=it=>isBoard()?` onclick="editGanttItem('${it.src}',${it.si})"`:'';
  const cur2=isBoard()?';cursor:pointer':'';
  const rows=items.map(it=>{
    if(it.kind==='ms'){const l=pos(it.date);
      return `<div class="g-row g-msrow"><div class="g-lbl" style="color:var(--gold-2);font-weight:700${cur2}" title="${esc(it.name)}"${clk(it)}>◆ ${esc(it.name)}</div><div class="g-track">${today}<div class="g-ms" style="left:${l}%" title="${esc(it.name)}"></div></div></div>`;}
    const l=pos(it.start),w=Math.max(1.5,pos(it.end)-pos(it.start));

/* ===== Eingabemaske (Form-Modal) ===== */
function showForm(title, fields, onSubmit, opts){
  opts=opts||{};
  const wrap=document.createElement('div'); wrap.className='sheet-bg';
  const fieldHtml=f=>{
    if(f.type==='textarea') return `<textarea class="fm-in" data-k="${f.key}" rows="3" placeholder="${esc(f.placeholder||'')}">${esc(f.value||'')}</textarea>`;
    if(f.type==='select') return `<select class="fm-in" data-k="${f.key}">${(f.options||[]).map(o=>`<option value="${esc(o.value)}"${String(o.value)===String(f.value||'')?' selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
    if(f.type==='file') return `<input class="fm-in" data-k="${f.key}" type="file"${f.accept?` accept="${f.accept}"`:''}>`;
    const t=f.type==='datetime'?'datetime-local':(f.type||'text');
    return `<input class="fm-in" data-k="${f.key}" type="${t}" value="${esc(f.value==null?'':String(f.value))}" placeholder="${esc(f.placeholder||'')}">`;
  };
  const body=fields.map(f=>`<div class="fm-row" data-row="${f.key}"><label>${esc(f.label)}</label>${fieldHtml(f)}</div>`).join('');
  wrap.innerHTML=`<div class="sheet fm-sheet"><h3>${esc(title)}</h3><div class="fm-body">${body}</div>
    <button class="btn-primary" id="fmSave">Speichern</button>
    ${opts.onDelete?'<button class="dismiss" id="fmDelete" style="color:var(--red);font-weight:600">🗑️ Eintrag löschen</button>':''}
    <button class="dismiss" id="fmCancel">Abbrechen</button></div>`;
  wrap.addEventListener('click',e=>{if(e.target===wrap)wrap.remove();});
  document.body.appendChild(wrap);
  const setRowShow=(k,show)=>{const r=wrap.querySelector(`.fm-row[data-row="${k}"]`);if(r)r.style.display=show?'':'none';};
  const collect=()=>{const v={};wrap.querySelectorAll('.fm-in').forEach(el=>v[el.dataset.k]=el.value);return v;};
  if(opts.onDelete){wrap.querySelector('#fmDelete').addEventListener('click',()=>{if(confirm("Diesen Eintrag wirklich löschen?")){opts.onDelete();wrap.remove();}});}
  wrap.querySelector('#fmCancel').addEventListener('click',()=>wrap.remove());
  wrap.querySelector('#fmSave').addEventListener('click',()=>{
    const vals={};const files={};
    wrap.querySelectorAll('.fm-in').forEach(el=>{if(el.type==='file'){files[el.dataset.k]=(el.files&&el.files[0])||null;}else{vals[el.dataset.k]=el.value.trim();}});
    if(onSubmit(vals,{files})!==false) wrap.remove();
  });
  if(typeof fields.__onChange==='function'){
    const run=()=>fields.__onChange(collect(),{setRowShow});
    wrap.querySelectorAll('.fm-in').forEach(el=>el.addEventListener('change',run)); run();
  }
  const first=wrap.querySelector('.fm-in'); if(first) setTimeout(()=>first.focus(),60);
}

function supaUpload(file){return new Promise((res,rej)=>{
  if(!SUPA){rej(new Error("kein Server"));return;}
  const safe=Date.now()+"-"+file.name.replace(/[^\w.\-]+/g,"_");
  fetch(SUPA_URL+"/storage/v1/object/app/docs/"+encodeURIComponent(safe),{method:"POST",
    headers:{apikey:SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"x-upsert":"true","Content-Type":file.type||"application/octet-stream"},body:file})
    .then(r=>{if(!r.ok)throw new Error("Status "+r.status);res(SUPA_URL+"/storage/v1/object/public/app/docs/"+encodeURIComponent(safe));}).catch(rej);
});}

}

function cycleFunding(i){const f=DATA.funding[i];if(f.status==="abgelehnt"){f.status="eingereicht";save();render();return;}
  const idx=FUND_FLOW.indexOf(f.status);f.status=idx<FUND_FLOW.length-1?FUND_FLOW[idx+1]:"abgelehnt";save();render();}
function addFunding(){
  showForm("Neue Förderung",[
    {key:"program",label:"Förderprogramm",type:"text",placeholder:"z. B. BAFA Heizungsförderung (Wärmepumpe)"},

    {key:"note",label:"Notiz",type:"textarea"}

function addTermin(){
  const fields=[
    {key:"typ",label:"Art",type:"select",value:"vorort",options:[
      {value:"vorort",label:"📍 Vor-Ort-Termin"},
      {value:"online",label:"💻 Online-Besprechung (Zoom)"},
      {value:"aktivitaet",label:"📊 Aktivität (Balken im Gantt)"},
      {value:"meilenstein",label:"◆ Meilenstein"}]},
    {key:"title",label:"Titel",type:"text"},
    {key:"date",label:"Datum",type:"date",value:TODAY()},
    {key:"time",label:"Uhrzeit",type:"time",value:"10:00"},
    {key:"end",label:"Ende (bei Aktivität)",type:"date",value:TODAY()},
    {key:"place",label:"Ort / Link",type:"text",value:"Baustelle Südring 50, vor Ort"},
    {key:"who",label:"Teilnehmer",type:"text"}
  ];
  fields.__onChange=(v,{setRowShow})=>{const meet=v.typ==='vorort'||v.typ==='online';
    setRowShow('time',meet);setRowShow('place',meet);setRowShow('who',meet);setRowShow('end',v.typ==='aktivitaet');};
  showForm("Neuer Eintrag",fields,v=>{
    if(!v.title)return false;
    if(v.typ==='aktivitaet')DATA.meetings.push({title:v.title,type:"aktivitaet",date:v.date,end:v.end||v.date});
    else if(v.typ==='meilenstein')DATA.meetings.push({title:v.title,type:"meilenstein",date:v.date});
    else DATA.meetings.push({title:v.title,type:v.typ,date:v.date+(v.time?("T"+v.time):""),place:v.place,who:v.who});
    save();render();
  });
}

function addDoc(){const name=prompt("Dokument-Name:");if(!name)return;const type=prompt("Typ (Angebot / Plan / Dokument):","Angebot")||"Dokument";
  const note=prompt("Notiz:")||"";DATA.documents.unshift({name,type,note,date:new Date().toISOString().slice(0,10)});save();render();}
function delDoc(i){if(confirm("Dokument löschen?")){DATA.documents.splice(i,1);save();render();}}
function docType(n){const e=(n.split('.').pop()||'').toLowerCase();if(['jpg','jpeg','png','gif','webp','heic'].includes(e))return 'Bild';return 'Dokument';}
function uploadDocs(ev){
  const files=[...ev.target.files]; if(!files.length) return;
  const who=(typeof USERNAME!=='undefined'&&USERNAME)?USERNAME:(ROLE_LABEL[ROLE]||"");
  files.forEach(file=>{
    if(SUPA){
      const safe=Date.now()+"-"+file.name.replace(/[^\w.\-]+/g,"_");
      fetch(SUPA_URL+"/storage/v1/object/app/docs/"+encodeURIComponent(safe),{
        method:"POST",
        headers:{apikey:SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"x-upsert":"true","Content-Type":file.type||"application/octet-stream"},
        body:file
      }).then(r=>{ if(!r.ok) throw new Error("Status "+r.status);
        const url=SUPA_URL+"/storage/v1/object/public/app/docs/"+encodeURIComponent(safe);
        DATA.documents.unshift({name:file.name.replace(/\.[^.]+$/,""),type:docType(file.name),date:new Date().toISOString().slice(0,10),note:"",url,by:who});
        save();render();
      }).catch(err=>alert("Upload fehlgeschlagen: "+(err&&err.message||err)));
    } else {
      DATA.documents.unshift({name:file.name.replace(/\.[^.]+$/,""),type:docType(file.name),date:new Date().toISOString().slice(0,10),note:"",by:who});
      save();render();
    }
  });
  ev.target.value="";
}

function editMatterport(){
  showForm("360°-Rundgang (Matterport)",[
    {key:"url",label:"Matterport-Einbettungslink",type:"text",value:DATA.project.matterport||"",placeholder:"https://my.matterport.com/show/?m=…"}
  ],v=>{DATA.project.matterport=v.url;save();render();});
}

function uploadPhotos(ev){const files=[...ev.target.files];if(!files.length)return;let pending=files.length;
  files.forEach(file=>{const reader=new FileReader();reader.onload=e=>{compressImage(e.target.result,1100,0.7).then(src=>{
    const cap=file.name.replace(/\.[^.]+$/,"")+" · "+new Date().toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});
    if(SUPA){
      const path = Date.now()+"_"+Math.random().toString(36).slice(2,8)+".jpg";
      fetch(SUPA_URL+"/storage/v1/object/"+SUPA_BUCKET+"/"+path,{
        method:"POST",
        headers:{apikey:SUPA_KEY, "Authorization":"Bearer "+SUPA_KEY, "Content-Type":"image/jpeg"},
        body: dataURLtoBlob(src)
      }).then(r=>{ if(!r.ok) throw new Error("Status "+r.status);
        const url = SUPA_URL+"/storage/v1/object/public/"+SUPA_BUCKET+"/"+path;
        DATA.photos.unshift({src:url,cap}); save(); render();
      }).catch(err=>alert("Upload fehlgeschlagen: "+(err&&err.message||err)));
    }else{
      DATA.photos.unshift({src,cap});
      if(--pending===0){save();render();}
    }});};reader.readAsDataURL(file);});}
function compressImage(dataUrl,maxW,quality){return new Promise(res=>{const img=new Image();
  img.onload=()=>{const scale=Math.min(1,maxW/img.width);const c=document.createElement("canvas");
    c.width=img.width*scale;c.height=img.height*scale;c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    res(c.toDataURL("image/jpeg",quality));};img.onerror=()=>res(dataUrl);img.src=dataUrl;});}
function openPhoto(i){const ph=DATA.photos[i];const wrap=document.createElement("div");wrap.className="modal";
  const media=ph.src?`<img src="${ph.src}">`:`<div style="font-size:120px">${ph.emoji||"📷"}</div>`;
  wrap.innerHTML=`<button class="x">×</button>${media}<div class="mcap">${esc(ph.cap||"")}${isAdmin()?' · <span style="color:#ff8e80;cursor:pointer" id="delPh">Foto löschen</span>':''}</div>`;
  wrap.addEventListener("click",e=>{if(e.target===wrap||e.target.classList.contains("x"))wrap.remove();});
  document.body.appendChild(wrap);const del=wrap.querySelector("#delPh");
  if(del)del.addEventListener("click",()=>{if(confirm("Dieses Foto löschen?")){DATA.photos.splice(i,1);save();wrap.remove();render();}});}

function postComment(){const inp=$("#cmtInput");const text=inp.value.trim();if(!text)return;

/* ============================================================
   SELF-INSTALL (Homescreen)
   ============================================================ */
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;}
function isiOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;
  if(ROLE) render(); // zeigt Banner sobald installierbar
});

function installDismissed(){try{return localStorage.getItem('s50_install_dismissed')==='1';}catch(e){return false;}}
function dismissInstall(){try{localStorage.setItem('s50_install_dismissed','1');}catch(e){}render();}

function installBanner(){
  if(isStandalone()||installDismissed()) return "";
  return `<div class="installbar">
    <div style="font-size:22px">📲</div>
    <div class="ib-txt">Südring 50 als App auf dem Home-Bildschirm ablegen</div>
    <button onclick="triggerInstall()">Ablegen</button>
    <button class="ib-close" onclick="dismissInstall()">×</button>
  </div>`;
}

function maybeOfferInstall(){
  if(isStandalone()) return;
  let asked=false; try{asked=sessionStorage.getItem('s50_install_asked')==='1';}catch(e){}
  if(asked || installDismissed()) return;
  try{sessionStorage.setItem('s50_install_asked','1');}catch(e){}
  setTimeout(triggerInstall, 1200); // freundlich nach dem Login fragen
}

function triggerInstall(){
  if(isStandalone()) return;
  if(deferredInstall){ // Android / Chrome – echter nativer Dialog
    deferredInstall.prompt();
    deferredInstall.userChoice.finally(()=>{deferredInstall=null;render();});
    return;
  }
  // iOS (und Fallback): Anleitung als Bottom-Sheet
  showInstallSheet();
}

function showInstallSheet(){
  if(document.querySelector('.sheet-bg')) return;
  const ios=isiOS();
  const wrap=document.createElement('div');wrap.className='sheet-bg';
  const steps = ios ? `
    <div class="st"><b>1</b><div>Unten in der Safari-Leiste auf <span class="share-ic">⬆️</span> <b>Teilen</b> tippen.</div></div>
    <div class="st"><b>2</b><div>Etwas nach unten scrollen und <b>„Zum Home-Bildschirm"</b> wählen.</div></div>
    <div class="st"><b>3</b><div>Oben rechts auf <b>„Hinzufügen"</b> tippen – fertig! 🎉</div></div>`
  : `
    <div class="st"><b>1</b><div>Im Browser-Menü (⋮) auf <b>„App installieren"</b> bzw. <b>„Zum Startbildschirm hinzufügen"</b> tippen.</div></div>
    <div class="st"><b>2</b><div>Bestätigen – die App liegt dann auf dem Home-Bildschirm.</div></div>`;
  wrap.innerHTML=`<div class="sheet">
    <div class="s-ico">S50</div>
    <h3>Auf den Home-Bildschirm legen</h3>
    <p>So hast du Südring 50 wie eine echte App immer griffbereit – mit eigenem Icon und Vollbild.</p>
    <div class="steps">${steps}</div>
    ${(!ios&&deferredInstall)?'<button class="btn-primary" id="nativeInstall">Jetzt installieren</button>':''}
    <button class="dismiss" id="sheetClose">Vielleicht später</button>
  </div>`;
  wrap.addEventListener('click',e=>{if(e.target===wrap)wrap.remove();});
  document.body.appendChild(wrap);
  const ni=wrap.querySelector('#nativeInstall');
  if(ni)ni.addEventListener('click',()=>{wrap.remove();triggerInstall();});
  wrap.querySelector('#sheetClose').addEventListener('click',()=>wrap.remove());
}

/* PWA manifest via Blob */
(function setupPWA(){try{
  const icon="data:image/svg+xml,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='112' fill='#0f2742'/><text x='256' y='340' font-size='220' font-family='Arial' font-weight='700' fill='#e0a83e' text-anchor='middle'>S50</text></svg>`);
  const manifest={name:"Südring 50 · Projektapp",short_name:"Südring 50",start_url:".",display:"standalone",background_color:"#0f2742",theme_color:"#0f2742",icons:[{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]};
  const blob=new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"});
  const link=document.createElement("link");link.rel="manifest";link.href=URL.createObjectURL(blob);document.head.appendChild(link);
}catch(e){}})();

(function init(){let s=null;try{s=sessionStorage.getItem(SESSION_KEY);}catch(e){}if(s&&USERS[s])startSession(s);bootstrapServer();})();
